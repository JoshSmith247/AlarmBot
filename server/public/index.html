<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AlarmBot</title>
<style>
  body { font: 18px system-ui; max-width: 24rem; margin: 2rem auto; padding: 0 1rem; }
  button, input { font: inherit; padding: .5rem .8rem; margin: .2rem 0; }
  #status { color: #555; }
  li { color: #444; font-size: 14px; }
</style>
<h1>AlarmBot</h1>
<p id="status">loading...</p>
<input id="time" type="time" value="07:30">
<button onclick="send('set ' + time.value)">Set alarm</button>
<button onclick="send('off')">Off</button><br>
<button onclick="send('ring')">Ring now</button>
<button onclick="send('stop')">Stop</button>
<ul id="events"></ul>
<script>
  const key = localStorage.key_ || (localStorage.key_ = prompt("Key") || "");
  const api = (path, opt) => fetch(path + (path.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(key), opt);
  async function send(cmd) {
    const r = await api("/api/cmd", { method: "POST", body: cmd });
    if (r.status === 401) { localStorage.removeItem("key_"); location.reload(); }
    refresh();
  }
  async function refresh() {
    const s = await (await api("/api/state")).json();
    status.textContent = `${s.enabled ? "Alarm " + s.alarm : "Alarm off"} · bot ${s.online ? "online" : "offline"}${s.ringing ? " · RINGING" : ""}`;
    events.innerHTML = s.events.slice().reverse().map((e) => `<li>${e.t.slice(11, 19)} ${e.text}</li>`).join("");
  }
  refresh();
  setInterval(refresh, 3000);
</script>
